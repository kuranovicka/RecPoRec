name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform & build-tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace 2>&1 | tee /tmp/build_output.txt || true

      - name: Post build error as issue on failure
        if: always()
        run: |
          if grep -q "BUILD FAILED\|FAILURE:" /tmp/build_output.txt; then
            ERROR_TEXT=$(grep -B 5 -A 40 "error:" /tmp/build_output.txt | head -c 60000)
            if [ -z "$ERROR_TEXT" ]; then
              ERROR_TEXT=$(tail -n 150 /tmp/build_output.txt)
            fi
            curl -s -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/issues \
              -d "$(jq -n --arg body "$ERROR_TEXT" '{title: "build-error-log", body: ("```\n" + $body + "\n```")}')"
            exit 1
          fi

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecPoRec-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
